name: Dev Branch Push Notification

on:
  push:
    branches:
      - dev

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: 发送 QQ 邮件通知
        uses: dawidd6/action-send-mail@v3
        env:
          # 修复 Node.js 20 弃用警告，强制使用 Node 24 运行
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: 981130406@qq.com
          password: ${{ secrets.QQ_MAIL_KEY }}
          subject: "【GitHub 通知】dev 分支有新的代码推送！"
          from: GitHub 机器人 <981130406@qq.com>
          to: 981130406@qq.com,2012209952@qq.com
          body: |
            项目仓库: ${{ github.repository }}
            触发分支: ${{ github.ref_name }}
            代码推送者: ${{ github.actor }}
            
            最新提交信息:
            ${{ github.event.head_commit.message }}
            
            查看本次提交对比详情:
            ${{ github.event.compare }}