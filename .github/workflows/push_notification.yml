name: Dev Branch Push Notification

on:
  push:
    branches:
      - dev

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      # 第一步：正常发送，但允许失败
      - name: 发送 QQ 邮件通知（首次尝试）
        id: mail_first_try
        continue-on-error: true # 失败时不直接中断整个 Job
        uses: dawidd6/action-send-mail@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: 981130406@qq.com
          password: ${{ secrets.QQ_MAIL_KEY }}
          subject: "【dev】${{ github.event.head_commit.message }}"
          from: GitHub <981130406@qq.com>
          to: 981130406@qq.com,2012209952@qq.com
          body: |
            项目仓库: ${{ github.repository }}
            触发分支: ${{ github.ref_name }}
            代码推送者: ${{ github.actor }}
            最新提交信息: ${{ github.event.head_commit.message }}
            查看对比详情: ${{ github.event.compare }}

      # 第二步：如果第一步失败了，执行重试
      - name: 发送 QQ 邮件通知（网络超时重试）
        if: steps.mail_first_try.outcome == 'failure' # 仅在首次失败时触发
        uses: dawidd6/action-send-mail@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: 981130406@qq.com
          password: ${{ secrets.QQ_MAIL_KEY }}
          subject: "【dev重发】${{ github.event.head_commit.message }}"
          from: GitHub <981130406@qq.com>
          to: 981130406@qq.com,2012209952@qq.com
          body: "（注意：这是重试发送的邮件）\n\n项目仓库: ${{ github.repository }}..."